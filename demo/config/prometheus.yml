global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: powerauth-server
    static_configs:
      - targets: ['powerauth-server:8080']
    metrics_path: /powerauth-java-server/actuator/prometheus
    relabel_configs:
      - target_label: service
        replacement: powerauth-java-server
